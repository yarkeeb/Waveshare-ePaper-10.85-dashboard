name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: make package
      - run: go run ./cmd/dashboard -demo -once -output /tmp/dashboard.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deployment-packages
          path: dist/
          if-no-files-found: error
